# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fitx-gym
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitx-gym-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"

databases:
  - name: fitx-gym-db
    plan: free
    databaseName: fitxgym
    user: fitx
