# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fitx-gym
    runtime: node
    # Free sleeps after 15 min idle and shows Render's splash to visitors.
    # For the live gym, change this service in the Render Dashboard to Starter (~$7/month).
    plan: free
    # Seed runs on deploy so you do not need Render Shell (paid).
    # Production seed only creates missing owners/plans — it will not reset live passwords.
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma db push && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitx-gym-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: PUBLIC_SITE_URL
        sync: false
      - key: SEED_OWNER1_EMAIL
        sync: false
      - key: SEED_OWNER1_PASSWORD
        sync: false
      - key: OTP_FROM_EMAIL
        value: "Fit X Gym <deepaksolanki@fitxgymkhurja.com>"
      - key: SMTP_HOST
        value: smtpout.secureserver.net
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: deepaksolanki@fitxgymkhurja.com
      - key: SMTP_PASS
        sync: false

databases:
  - name: fitx-gym-db
    plan: free
    databaseName: fitxgym
    user: fitx
