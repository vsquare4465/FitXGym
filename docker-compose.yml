services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitx
      POSTGRES_PASSWORD: fitx_dev_password
      POSTGRES_DB: fitxgym
    ports:
      - "5432:5432"
    volumes:
      - fitx_pg_data:/var/lib/postgresql/data

volumes:
  fitx_pg_data:
